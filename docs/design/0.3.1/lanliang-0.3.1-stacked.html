<style>

.mbrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mbrow .lab{width:120px;font-size:12px;font-weight:600;color:#3a3a3c}.dark .mbrow .lab{color:#e5e5ea}

<svg data-k="refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75"/><path d="M13 2.2v2.9h-2.9"/></svg>
<svg data-k="update" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8v5.6M5.6 8.2 8 10.6l2.4-2.4"/></svg>
<svg data-k="gear" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.1"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1" stroke-linecap="round"/><circle cx="8" cy="8" r="4.6"/></svg>
<svg data-k="codex" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 1.2 12 4.1v5.8L7 12.8 2 9.9V4.1z"/><path d="M4.8 6 6.3 7 4.8 8M7.6 8.4h1.8" stroke-linecap="round"/></svg>
<svg data-k="gemini" viewBox="0 0 14 14" fill="currentColor"><path d="M7 .8c.5 3.3 2.9 5.7 6.2 6.2-3.3.5-5.7 2.9-6.2 6.2C6.5 9.9 4.1 7.5.8 7 4.1 6.5 6.5 4.1 7 .8z"/></svg>
<svg data-k="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.5 4.3 4.3 0 0 0 7 18z"/><path d="M4 4l16 16"/></svg>
<svg data-k="sliders" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/><circle cx="6" cy="4" r="1.6" fill="currentColor"/><circle cx="10" cy="8" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/></svg>
<svg data-k="eye" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
<svg data-k="sum" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="9" width="3" height="5" rx="1"/><rect x="6.5" y="5" width="3" height="9" rx="1"/><rect x="11" y="2" width="3" height="12" rx="1"/></svg>
</template>

<script>
const I={};document.querySelector('#ico').content.querySelectorAll('svg').forEach(s=>I[s.dataset.k]=s.outerHTML);
function tokens(n){if(n>=1e8)return (n/1e8).toFixed(2)+'亿';if(n>=1e4)return (n/1e4).toFixed(2)+'万';return ''+n}
function axis(n){if(n>=1e8)return tokens(n);if(n>=1e7)return Math.round(n/1e4)+'万';return tokens(n)}
function series(seed,max,n=30){let a=[],x=seed;for(let i=0;i<n;i++){x=(x*9301+49297)%233280;let v=x/233280;a.push(v<.12?0:Math.round(max*(.15+.85*v)))}
 a[Math.floor(n*.4)]=max;return a}
const CODEX=series(7,335000000), GEM=series(3,89000000);
function chart(vals,{hover=-1,startM=10,startD=26}={}){
 const W=352,H=132,ax=40,lb=18,pw=W-ax-4,ph=H-lb-6,slot=pw/vals.length,mx=Math.max(...vals,1);
 let s=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA040"/><stop offset="1" stop-color="#F2780C"/></linearGradient></defs>`;
 [1,.5,0].forEach(f=>{const y=6+ph*(1-f);if(f<1)s+=`<line x1="${ax}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity="${f?.1:.18}" stroke-width=".5" ${f?'stroke-dasharray="2 3"':''}/>`;
  s+=`<text x="${ax-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".5" style="font-variant-numeric:tabular-nums">${axis(Math.round(mx*f))}</text>`});
 vals.forEach((v,i)=>{const h=v?Math.max(2,ph*v/mx):0,x=ax+slot*i+slot*.18,w=slot*.64,y=6+ph-h;
  const op=hover<0?1:(i===hover?1:.45);
  if(h)s+=`<path d="M${x} ${y+h}V${y+Math.min(2,h)}q0-2 2-2h${w-4}q2 0 2 2V${y+h}z" fill="url(#g)" opacity="${op}"/>`;
  if(i%7===0){let d=new Date(2026,startM-1,startD+i);s+=`<text x="${x+w/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".5">${d.getMonth()+1}/${d.getDate()}</text>`}});
 if(hover>=0){const x=ax+slot*hover+slot/2;s+=`<line x1="${x}" x2="${x}" y1="6" y2="${6+ph}" stroke="currentColor" stroke-opacity=".25" stroke-width=".5"/>`}
 s+='</svg>';
 if(hover>=0){const d=new Date(2026,startM-1,startD+hover);const left=Math.min(Math.max(ax+slot*hover+slot/2-55,0),W-118);
  s+=`<div class="ctip" style="left:${left}px;top:-4px">${d.getMonth()+1}月${d.getDate()}日<br><b>${tokens(vals[hover])} Tokens</b></div>`}
 return s}
function header({ago='3 分钟前',spin=false,upd=false,hov=''}={}){
 const refTip=spin?'正在刷新…':`<b>刷新</b><br>上次更新 ${ago}`;
 const updTip=upd?`<b>有新版本 0.2.1</b><br>点击查看更新内容并安装`:'<b>检查更新</b><br>当前 0.2.0，已是最新';
 return `<div class="hd"><div class="logo">${I.logo}</div><div class="name">栏量</div><div class="sp"></div>
 <span class="ago">${spin?'正在刷新…':ago+'更新'}</span>
 <button class="ib ${spin?'spin':''} ${hov==='r'?'hov':''}">${I.refresh}<span class="tt">${refTip}</span></button>
 <button class="ib ${hov==='u'?'hov':''}">${I.update}${upd?'<span class="dot"></span>':''}<span class="tt">${updTip}</span></button>
 <button class="ib ${hov==='s'?'hov':''}">${I.gear}<span class="tt"><b>设置</b></span></button></div>`}
function tabs(on,cw=77,gw=44){return `<div class="tabs">
 <div class="tab ${on==='c'?'on':''}"><div class="t1">${I.codex}Codex<span class="pct">${cw}%</span></div><div class="mini"><i style="width:${cw}%"></i></div></div>
 <div class="tab ${on==='g'?'on':''}"><div class="t1">${I.gemini}Gemini<span class="pct">${gw}%</span></div><div class="mini"><i style="width:${gw}%" class="${gw<20?'low':''}"></i></div></div></div>`}
function quota(rows){return `<div class="card"><div class="ch"><span class="ct">剩余额度</span></div>${rows.map(r=>`<div class="q"><div class="qr"><span class="ql">${r[0]}</span><span class="qv ${r[1]<20?'low':''}">${r[1]}<small>%</small></span><span class="qreset">${r[2]}后重置</span></div><div class="bar"><i style="width:${r[1]}%" class="${r[1]<20?'low':''}"></i></div></div>`).join('')}</div>`}
function usage({svc='c',state='ok',hover=-1}){
 const local=svc==='g'?'<span class="cs">仅本机</span>':'<span class="cs">官方</span>';
 let body;
 if(state==='loading')body=`<div class="state"><div class="skel">${Array.from({length:14},(_,i)=>`<i style="height:${20+((i*37)%60)}%;animation-delay:${i*.06}s"></i>`).join('')}</div>正在统计…</div>`;
 else if(state==='fail')body=`<div class="state">${I.cloud}官方用量暂时拿不到<button class="retry">重试</button></div>`;
 else body=`<div class="chart">${chart(svc==='g'?GEM:CODEX,{hover})}</div>`;
 return `<div class="card"><div class="ch"><span class="ct">Token 用量</span>${local}<div class="seg"><span class="on">每日</span><span>每周</span><span>每月</span></div></div>${body}</div>`}
function codexBody(o={}){return `<div class="acct"><span class="plan">Pro 200</span><span class="mail">a***@example.com</span><span class="sub">至 2026/12/12 · 剩 17 天</span></div>
 ${quota([['每周',77,'3天2小时']])}${usage({svc:'c',...o})}`}
function gemBody(o={}){return `<div class="acct"><span class="plan">Google AI Pro</span><span class="mail">a***@gmail.com</span></div>
 ${quota([['每周',44,'3天6小时'],['5 小时',64,'2小时12分']])}${usage({svc:'g',...o})}`}
function settingsWin(dk,upd){return `<div class="win ${dk?'dk':''}"><div class="tb"><div class="tl"><i></i><i></i><i></i></div><div class="wt">栏量设置</div></div><div class="wb">
 <div class="grp"><div class="row"><div>登录时启动<div class="d">开机后自动出现在菜单栏</div></div><div class="r"><span class="sw on"></span></div></div>
 <div class="row"><div>自动检查更新<div class="d">有新版本时在面板上提示</div></div><div class="r"><span class="sw on"></span></div></div></div>
 <div class="abt"><div class="logo">${I.logo}</div><span class="v">栏量 0.2.0</span>${upd?'<span class="new">0.2.1 可用</span>':''}<span class="lnk">检查更新</span><span class="quit">退出栏量</span></div></div></div>`}
function panel({tab='c',hd={},body,cls='',extra=''}){return `<div class="p ${cls}">${header(hd)}${tabs(tab)}<div class="bd">${body}</div><div class="ft"></div>${extra}</div>`}
const col=(cap,html,leg='')=>`<div><div class="cap">${cap}</div>${html}${leg?`<div class="legend">${leg}</div>`:''}</div>`;
function board(dark,id){return `<div class="board ${dark?'dark':''}" id="${id}">
 ${col('① Codex 正常 · 悬停柱子',panel({tab:'c',hd:{upd:true},body:codexBody({hover:12})}))}
 ${col('② Gemini 正常（仅本机，刻度「8900万」）',panel({tab:'g',body:gemBody()}))}
 ${col('③ 正在统计…（刷新转圈）',panel({tab:'g',hd:{spin:true},body:gemBody({state:'loading'})}))}
 ${col('④ 官方用量暂时拿不到',panel({tab:'c',body:codexBody({state:'fail'})}))}</div>`}

function heroP(svc){const c=svc==='c';return `<div class="hero"><div class="hi">${c?I.codex:I.gemini}</div><div class="hn">${c?'Codex':'Gemini'}</div>
 <span class="plan">${c?'Pro 200':'Google AI Pro'}</span><span class="hm">${c?'a***@example.com':'a***@gmail.com'}</span>${c?'<span class="hs">剩 17 天</span>':''}</div>`}
function singlePanel(svc,o={}){const c=svc==='c';
 const q=c?[['每周',77,'3天2小时']]:[['每周',44,'3天6小时'],['5 小时',64,'2小时12分']];
 return `<div class="p">${header(o.hd||{})}${heroP(svc)}<div class="bd"><div class="big">${quota(q)}</div>${usage({svc,...(o.u||{})})}</div><div class="ft"></div></div>`}
const ic=(k,s=11)=>I[k].replace('<svg','<svg width="'+s+'" height="'+s+'"');
function mb(mode){let it;
 if(mode==='both')it=`<div class="it"><div class="two"><div>${ic('codex',8)}77%<span>—</span></div><div>${ic('gemini',8)}44%<span>64</span></div></div></div>`;
 else if(mode==='c')it=`<div class="it">${ic('codex',15)}<div class="one">77%</div></div>`;
 else it=`<div class="it">${ic('gemini',15)}<div class="one">44%<span>64</span></div></div>`;
 return `<div class="mb">${it}<span class="sys">🔋 100%</span><span class="sys">周三 02:30</span></div>`}

function stack(cv,gv,{hover=-1,startM=10,startD=26}={}){
 const W=456,H=132,ax=44,lb=18,pw=W-ax-4,ph=H-lb-6,n=cv.length,slot=pw/n,tot=cv.map((v,i)=>v+gv[i]),mx=Math.max(...tot,1);
 let s=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA040"/><stop offset="1" stop-color="#F2780C"/></linearGradient></defs>`;
 [1,.5,0].forEach(f=>{const y=6+ph*(1-f);if(f<1)s+=`<line x1="${ax}" x2="${W}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity="${f?.1:.18}" stroke-width=".5" ${f?'stroke-dasharray="2 3"':''}/>`;
  s+=`<text x="${ax-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".5">${axis(Math.round(mx*f))}</text>`});
 for(let i=0;i<n;i++){const x=ax+slot*i+slot*.18,w=slot*.64,op=hover<0||i===hover?1:.45;const hc=ph*cv[i]/mx,hg=ph*gv[i]/mx,base=6+ph;
  const top=(y,h,fill)=>`<path d="M${x} ${y+h}V${y+Math.min(2,h)}q0-2 2-2h${w-4}q2 0 2 2V${y+h}z" fill="${fill}" opacity="${op}"/>`;
  if(gv[i]>0){s+=`<rect x="${x}" y="${base-hc}" width="${w}" height="${hc}" fill="url(#g3)" opacity="${op}"/>`;s+=top(base-hc-hg,hg,'#8E8CF5')}
  else if(hc)s+=top(base-hc,hc,'url(#g3)');
  if(i%7===0){let d=new Date(2026,startM-1,startD+i);s+=`<text x="${x+w/2}" y="${H-3}" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".5">${d.getMonth()+1}/${d.getDate()}</text>`}}
 if(hover>=0){const x=ax+slot*hover+slot/2;s+=`<line x1="${x}" x2="${x}" y1="6" y2="${6+ph}" stroke="currentColor" stroke-opacity=".25" stroke-width=".5"/>`}
 s+='</svg>';
 if(hover>=0){const d=new Date(2026,startM-1,startD+hover);const left=Math.min(Math.max(ax+slot*hover+slot/2-150,0),W-140);
  s+=`<div class="ctip" style="left:${left}px;top:-4px">${d.getMonth()+1}月${d.getDate()}日<div class="ln"><i style="background:#F2780C"></i>Codex ${tokens(cv[hover])}</div><div class="ln"><i style="background:#8E8CF5"></i>Gemini ${tokens(gv[hover])}</div><b>合计 ${tokens(tot[hover])} Tokens</b></div>`}
 return s}
let _x=11;const rnd=()=>{_x=(_x*9301+49297)%233280;return _x/233280};
const CX=Array.from({length:30},()=>Math.round((0.5+2.9*rnd())*1e8));
const GM=Array.from({length:30},(_,i)=>i<16?0:Math.round(9e7*rnd()));
function sw3(dk,o={}){
 const c=o.c!==false,g=o.g!==false,only=(c?1:0)+(g?1:0)===1,fail=!!o.fail;
 const cvs=CX.map(v=>c&&!fail?v:0),gvs=GM.map(v=>g?v:0),t=cvs.reduce((a,b)=>a+b,0)+gvs.reduce((a,b)=>a+b,0);
 const sum=`<div class="sumh"><span class="lb">累计</span><span class="n">${tokens(t)}</span>${fail&&c?'<span class="inc">不完整</span>':''}<div class="seg" style="margin-left:auto"><span class="on">每日</span><span>每周</span><span>每月</span></div></div>
  <div class="chart" style="margin:4px 12px 12px">${stack(cvs,gvs,{hover:o.hover??-1})}</div>`;
 return `<div class="sw3 ${dk?'dk':''}"><div class="tb"><div class="tl"><i></i><i></i><i></i></div><div class="wt">栏量设置</div></div><div class="wrap">
 <div class="grp"><div class="gh"><span class="ct">监听服务</span><span class="cs">开启的服务显示在菜单栏和面板里；只开一个时放大显示</span></div>
  <div class="row"><div class="si">${I.codex}</div><div>Codex<div class="d">已登录 · Pro 200 · a***@example.com</div></div><div class="r"><span class="sw ${c?'on':''} ${only&&c?'dis':''}"></span></div></div>
  <div class="row"><div class="si">${I.gemini}</div><div>Gemini<div class="d">已登录 · Google AI Pro · a***@gmail.com</div></div><div class="r"><span class="sw ${g?'on':''} ${only&&g?'dis':''}"></span></div></div>
  ${only?'<div class="hint" style="margin:0;padding:0 12px 10px"><i>i</i>至少保留一个服务，最后一个开关不能关。</div>':''}</div>
 <div class="grp"><div class="gh"><span class="ct">消耗汇总</span><span class="cs">${c&&g?'Codex + Gemini 累计':'仅已开启的服务'}</span></div>
  ${sum}</div>
 <div class="grp"><div class="row"><div>登录时启动<div class="d">开机后自动出现在菜单栏</div></div><div class="r"><span class="sw on"></span></div></div>
  <div class="row"><div>自动检查更新<div class="d">有新版本时在面板上提示</div></div><div class="r"><span class="sw on"></span></div></div></div>
 <div class="ver"><div class="logo" style="width:16px;height:16px;border-radius:4px">${I.logo}</div><span class="v">栏量 0.3.1</span>${o.upd?'<span class="new">0.3.1 可用</span>':''}<span class="lnk">检查更新</span><span class="quit">退出栏量</span></div>
 </div></div>`}
function setBoard(dark,id){return `<div class="board ${dark?'dark':''}" id="${id}">
 ${col('两个服务都开 · 每日 · 悬停（堆叠：Codex 下 / Gemini 上）',sw3(dark,{hover:26}))}
 ${col('只开 Codex · 单色柱',sw3(dark,{g:false}))}
 ${col('Codex 接口失败 · 不完整（只画 Gemini）',sw3(dark,{fail:true}))}</div>`}
function panBoard(dark,id){return `<div class="board ${dark?'dark':''}" id="${id}">
 <div><div class="cap">M 菜单栏三种状态</div>
  <div class="mbrow"><span class="lab">双服务（现状）</span>${mb('both')}</div>
  <div class="mbrow"><span class="lab">只开 Codex · 放大</span>${mb('c')}</div>
  <div class="mbrow"><span class="lab">只开 Gemini · 放大</span>${mb('g')}</div></div>
 ${col('P1 双服务（0.2.x 现状对照）',panel({tab:'c',body:codexBody()}))}
 ${col('P2 只开 Codex：无页签，放大',singlePanel('c'))}
 ${col('P3 只开 Gemini：无页签，放大',singlePanel('g',{u:{hover:12}}))}</div>`}
document.getElementById('root').innerHTML=setBoard(false,'setl')+setBoard(true,'setd');
</script></body></html>
