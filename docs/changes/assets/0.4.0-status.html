<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>栏量 0.4.0 样稿：AI 会话状态</title>
<style>
body{margin:0;padding:24px;font:13px -apple-system,"PingFang SC",sans-serif;background:#f2f2f4;color:#1d1d1f}
h1{font-size:18px;margin:0 0 4px} p.note{color:#6e6e73;margin:0 0 20px}
.cols{display:flex;gap:24px;flex-wrap:wrap}
.scheme{flex:1;min-width:440px;padding:16px;border-radius:12px}
.light{background:#fff;color:#1d1d1f;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#aeaeb2;--card:#f5f5f7;--bar:rgba(246,246,246,.92);--blue:#007AFF;--green:#34C759;--red:#FF3B30}
.dark{background:#1c1c1e;color:#f5f5f7;--ink:#f5f5f7;--ink2:#98989d;--ink3:#636366;--card:#2c2c2e;--bar:rgba(40,40,40,.92);--blue:#0A84FF;--green:#30D158;--red:#FF453A}
h2{font-size:14px;margin:0 0 10px} h3{font-size:12px;color:var(--ink2);margin:16px 0 6px;font-weight:600}
.bar{display:inline-flex;align-items:center;height:24px;padding:0 8px;background:var(--bar);border-radius:5px;color:var(--ink);margin:0 10px 8px 0;vertical-align:top}
.q{display:flex;flex-direction:column;font:600 9.5px/10px ui-monospace,SFMono-Regular,monospace}
.q span small{font-size:8.5px} .q1{font:500 12px ui-monospace,monospace}
.dot{width:6px;height:6px;border-radius:50%;margin-left:4px;flex:none}
.d-working{background:var(--blue);animation:blink 2s steps(1) infinite}
.d-done{background:var(--green)} .d-err{background:var(--red)}
@keyframes blink{0%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.d-working{animation:none}}
.lbl{font-size:11px;color:var(--ink2);margin:0 0 2px}
.panel{width:400px;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid rgba(128,128,128,.25);margin-bottom:12px}
.card{background:var(--card);border-radius:8px;padding:8px 10px}
.title{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.row{display:flex;align-items:center;height:22px}
.row .dot{margin:0 6px 0 0} .row .nodot{width:6px;margin-right:6px}
.name{width:96px;font-size:13px;color:var(--ink)} .st{flex:1;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.c-blue{color:var(--blue)} .c-green{color:var(--green)} .c-red{color:var(--red)} .c-idle{color:var(--ink3)}
.rest{margin-top:8px;height:54px;border-radius:8px;background:var(--card);opacity:.5;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px}
</style></head><body>
<h1>栏量 0.4.0 样稿：AI 会话状态</h1>
<p class="note">以契约 docs/changes/0.4.0.md 为准；样稿只示意，不进产品代码。蓝点 2 秒一周期两帧硬切；系统「减少动态效果」时常亮。</p>
<div class="cols" id="cols"></div>
<script>
const bars=[["工作中","d-working"],["刚完成","d-done"],["已中断 / 出错","d-err"],["空闲","" ]];
const panels=[
 ["Codex 工作中 + Antigravity 刚完成",[["d-working","工作中 · 12 分钟","c-blue"],["d-done","刚完成","c-green"]]],
 ["Codex 已中断 + Antigravity 出错",[["d-err","已中断","c-red"],["d-err","出错","c-red"]]],
 ["两个都空闲",[["","空闲","c-idle"],["","空闲","c-idle"]]],
 ["最长文案",[["","空闲","c-idle"],["d-working","工作中 · 1 小时以上","c-blue"]]]];
function scheme(cls,name){
 let h=`<div class="scheme ${cls}"><h2>${name}</h2><h3>菜单栏 · 两行模式</h3>`;
 for(const [t,d] of bars) h+=`<div style="display:inline-block"><div class="lbl">${t}</div><div class="bar"><div class="q"><span>◎ 64%｜<small>38</small></span><span>✦ 81%｜<small>92</small></span></div>${d?`<div class="dot ${d}"></div>`:""}</div></div>`;
 h+=`<h3>菜单栏 · 单行模式</h3>`;
 for(const [t,d] of bars) h+=`<div style="display:inline-block"><div class="lbl">${t}</div><div class="bar"><span class="q1">◎ 64%｜38</span>${d?`<div class="dot ${d}"></div>`:""}</div></div>`;
 h+=`<h3>面板「会话」一栏（额度区上方，两个页签相同）</h3>`;
 for(const [t,rows] of panels){
  h+=`<div class="lbl">${t}</div><div class="panel"><div class="card"><div class="title">会话</div>`;
  ["Codex","Antigravity"].forEach((n,i)=>{const [d,s,c]=rows[i];h+=`<div class="row">${d?`<div class="dot ${d}"></div>`:`<div class="nodot"></div>`}<div class="name">${n}</div><div class="st ${c}">${s}</div></div>`});
  h+=`</div><div class="rest">（额度区，与 0.3.15 相同）</div></div>`;}
 return h+`</div>`;}
document.getElementById('cols').innerHTML=scheme('light','浅色')+scheme('dark','深色');
</script></body></html>
