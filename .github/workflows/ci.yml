name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner（macos-latest 排队太久时换 macos-15-intel）"
        required: false
        default: macos-latest
        type: choice
        options: [macos-latest, macos-15-intel, macos-26-intel]

jobs:
  build:
    name: Test, build and smoke (no publish)
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 30
    env:
      TAG: v0.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load project.env
        shell: bash
        run: |
          set -euo pipefail
          source ./project.env
          {
            echo "NAME=$NAME"
            echo "DISPLAY_NAME=$DISPLAY_NAME"
            echo "VERSION=${TAG#v}"
          } >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Unit tests
        shell: bash
        run: |
          set -uo pipefail
          swift test 2>&1 | tee /tmp/tests.log
          status=${PIPESTATUS[0]}
          echo "RELEASE: $(grep -E 'Executed [0-9]+ tests' /tmp/tests.log | tail -n 1)"
          exit "$status"

      - name: Build universal app, dmg, zip
        run: scripts/build.sh "$VERSION"

      - name: Dry-run appcast (no key) and check
        run: |
          DRY_RUN=1 scripts/appcast.sh "$VERSION"
          scripts/check_appcast.sh dist/appcast.xml
          # 同时用当前最新的正式发版说明生成一次 HTML，确保转换器能处理
          latest=$(ls release-notes/v*.md 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then v=$(basename "$latest" .md); python3 scripts/notes.py html "${v#v}"; fi

      - name: Verify archs, signature, bundle
        shell: bash
        run: |
          set -euo pipefail
          app="build/${NAME}.app"
          bin="$app/Contents/MacOS/$NAME"
          archs=$(lipo -archs "$bin"); echo "RELEASE: lipo=$archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          fw="$app/Contents/Frameworks/Sparkle.framework/Sparkle"
          echo "RELEASE: sparkle archs=$(lipo -archs "$fw")"
          codesign -dv --verbose=2 "$app" 2>&1 | tee /tmp/codesign.log
          grep -q "Signature=adhoc" /tmp/codesign.log
          if grep -q "runtime" /tmp/codesign.log; then echo "::error::不应开启 hardened runtime"; exit 1; fi
          otool -L "$bin" | grep -q "@rpath/Sparkle.framework"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" | grep -qx "$VERSION"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$app/Contents/Info.plist"
          test -s "$app/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist" | grep -qx "AppIcon"
          echo "RELEASE: icon=AppIcon.icns $(stat -f%z "$app/Contents/Resources/AppIcon.icns")B"
          echo "RELEASE: codesign=adhoc version=$VERSION"

      - name: Smoke test (arm64 native + x86_64 Rosetta)
        shell: bash
        run: |
          set -euo pipefail
          bin="build/${NAME}.app/Contents/MacOS/$NAME"
          if [ "$(uname -m)" = "arm64" ] && ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          archs="x86_64"; [ "$(uname -m)" = "arm64" ] && archs="arm64 x86_64"
          for a in $archs; do
            arch -"$a" "$bin" >"/tmp/smoke-$a.log" 2>&1 &
            pid=$!
            sleep 8
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::$a 进程 8 秒内退出"; cat "/tmp/smoke-$a.log"; exit 1
            fi
            kill -TERM "$pid" || true; sleep 1; kill -KILL "$pid" 2>/dev/null || true
            echo "RELEASE: smoke=$a alive 8s"
          done

      - name: Render diagnostics (which view needs GPU)
        continue-on-error: true
        shell: bash
        run: |
          bin="build/${NAME}.app/Contents/MacOS/$NAME"
          export LANLIANG_FAKE="$PWD/fixtures/normal.json"
          try() { "$bin" --debug-render="$RUNNER_TEMP/diag" "$@" >/tmp/diag.log 2>&1; echo "RELEASE: diag [$*] exit=$? $(grep -o 'DEBUG_RENDER.*' /tmp/diag.log)"; }
          try --debug-only-tab=gemini
          try --debug-only-tab=codex --debug-no-chart
          try --debug-only-tab=codex
          try --debug-only-tab=codex --debug-hover=auto --debug-no-shadow
          try --debug-only-tab=codex --debug-hover=auto

      - name: Screenshots
        run: scripts/ci_screenshots.sh

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          if-no-files-found: warn
          path: shots/

