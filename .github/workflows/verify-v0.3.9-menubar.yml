name: Verify v0.3.9 menu bar
on:
  push:
    branches: ['verify/v0.3.9-menubar']
    paths: ['.github/workflows/verify-v0.3.9-menubar.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ddc72e0ca88b90db4f0dda08745572ca3124bf5b
          persist-credentials: false
      - name: Exact source check
        run: test "$(git rev-parse HEAD)" = "ddc72e0ca88b90db4f0dda08745572ca3124bf5b"
      - name: Build native package without OAuth credentials
        run: env -u ANTIGRAVITY_CLIENT_ID -u ANTIGRAVITY_CLIENT_SECRET scripts/build.sh 0.3.9
      - name: Native menu bar appearance cases
        run: TZ=UTC bash scripts/ci_v039.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v039-menubar
          path: shots/menubar-v039/
