name: Verify v0.3.6 chart filter
on:
  push:
    branches: ['verify/v0.3.6-chart-filter']
    paths: ['.github/workflows/verify-v0.3.6-chart-filter.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ad6659fff192250ca13c5e612422226fdfc07fb
          persist-credentials: false
      - name: Unit tests and exact source
        run: |
          test "$(git rev-parse HEAD)" = "1ad6659fff192250ca13c5e612422226fdfc07fb"
          TZ=UTC swift test
          if grep -rnE '"(archived_)?sessions"|\.jsonl|CodexSessionLog' App Sources; then exit 1; fi
      - name: Build native target
        run: scripts/build.sh 0.3.6
      - name: Settings chart and selection screenshots
        run: TZ=UTC bash scripts/ci_model_distribution.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v036-settings-selection
          path: shots/model-distribution/
